name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      APP_CONFIG: testing
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff lint checks
        run: ruff check backend

      - name: Check Ruff formatting
        run: ruff format --check backend

      - name: Run pytest
        working-directory: backend
        run: pytest tests

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_CONFIG: development
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/teamflow_migration_check
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/teamflow_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/teamflow_migration_check
      RESTORE_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/teamflow_backup_restore_check
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Wait for PostgreSQL and create disposable databases
        run: |
          for attempt in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d postgres; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "PostgreSQL did not become ready." >&2
              exit 1
            fi
            sleep 2
          done
          psql "postgresql://postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "SELECT version();"
          createdb --host=localhost --username=postgres teamflow_migration_check
          createdb --host=localhost --username=postgres teamflow_test
          createdb --host=localhost --username=postgres teamflow_backup_restore_check

      - name: Upgrade from empty database
        working-directory: backend
        run: python -m flask --app run.py db upgrade

      - name: Verify migration schema and current revision
        working-directory: backend
        run: |
          python -m flask --app run.py db check
          python -m flask --app run.py db current
          python -m pytest tests/test_postgres_migrated_schema.py

      - name: Verify upgrade from the previous revision
        working-directory: backend
        run: |
          python -m flask --app run.py db downgrade 207ee96fe320
          python -m flask --app run.py db upgrade
          python -m flask --app run.py db current
          python -m flask --app run.py db check

      - name: Run disposable PostgreSQL backup and restore drill
        working-directory: backend
        run: |
          set -euo pipefail
          backup_file="$(mktemp "$RUNNER_TEMP/teamflow-backup-restore-XXXXXX.dump")"
          chmod 600 "$backup_file"
          trap 'rm -f -- "$backup_file"' EXIT
          python scripts/backup_restore_drill.py seed
          pg_dump \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="$backup_file" \
            "postgresql://postgres@localhost:5432/teamflow_migration_check"
          pg_restore --list "$backup_file" > /dev/null
          pg_restore \
            --exit-on-error \
            --no-owner \
            --no-privileges \
            --dbname="postgresql://postgres@localhost:5432/teamflow_backup_restore_check" \
            "$backup_file"
          DATABASE_URL="$RESTORE_DATABASE_URL" python scripts/backup_restore_drill.py verify
          DATABASE_URL="$RESTORE_DATABASE_URL" python -m flask --app run.py db current
          DATABASE_URL="$RESTORE_DATABASE_URL" python -m flask --app run.py db check

      - name: Run PostgreSQL integration tests
        working-directory: backend
        env:
          APP_CONFIG: testing
        run: pytest tests

      - name: Remove disposable databases
        if: always()
        run: |
          status=0
          for database in \
            teamflow_test \
            teamflow_backup_restore_check \
            teamflow_migration_check; do
            if ! dropdb --host=localhost --username=postgres --if-exists "$database"; then
              echo "Failed to remove disposable database: $database" >&2
              status=1
            fi
          done
          exit "$status"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build

      - name: Type-check browser tests
        working-directory: frontend
        run: npm run typecheck:e2e

  browser-e2e:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: frontend
        run: npm run e2e

      - name: Preserve safe browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: teamflow-browser-e2e-failure
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 3
